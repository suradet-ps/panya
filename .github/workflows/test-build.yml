name: Test Build

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "crates/**"
      - "script/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/test-build.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    name: Tauri Build (no bundle)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable (wasm target)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable

      - name: Rust Cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Trunk
        run: |
          # GitHub release downloads occasionally drop the connection;
          # retry before giving up.
          for attempt in 1 2 3 4; do
            curl -LsSf https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz -o trunk.tar.gz \
              && tar -xzf trunk.tar.gz \
              && sudo mv trunk /usr/local/bin/ \
              && break
            echo "trunk download failed (attempt $attempt/4) - retrying in 10s"
            sleep 10
          done
          test -x /usr/local/bin/trunk

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build Tauri App (Test Only)
        working-directory: apps/panya-app
        run: |
          # The beforeBuildCommand runs trunk build, which downloads the
          # wasm-bindgen CLI from GitHub releases and occasionally flakes
          # mid-connection - retry the whole build (caches make this cheap).
          for attempt in 1 2 3 4; do
            cargo tauri build --no-bundle && exit 0
            echo "tauri build failed (attempt $attempt/4) - retrying in 10s"
            sleep 10
          done
          exit 1
