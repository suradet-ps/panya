<svg xmlns="http://www.w3.org/2000/svg" viewBox="24 24 522 522" width="100%" height="100%">
  <defs>
    <pattern id="pop-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#FF80AB" stroke-width="3" opacity="0.5"/>
    </pattern>
    <filter id="pop-shadow-5">
      <feDropShadow dx="10" dy="10" stdDeviation="0" flood-color="#000000" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- พื้นหลังสีชมพู Pop Neon + ลายตาราง Comic -->
  <rect x="40" y="40" width="480" height="480" rx="60" fill="#FF4081" stroke="#000000" stroke-width="12" filter="url(#pop-shadow-5)"/>
  <rect x="40" y="40" width="480" height="480" rx="60" fill="url(#pop-grid)"/>

  <!-- แผ่นคลิปบอร์ด/ชาร์ตยาเอียงนิดๆ -->
  <g transform="translate(280, 280) rotate(-6) translate(-280, -280)" filter="url(#pop-shadow-5)">
    <!-- แผ่นกระดาษ -->
    <rect x="130" y="100" width="300" height="360" rx="25" fill="#FFEA00" stroke="#000000" stroke-width="11"/>
    
    <!-- คลิปหนีบกระดาษ -->
    <rect x="220" y="70" width="120" height="45" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="10"/>

    <!-- เส้นบรรทัดจำลอง -->
    <line x1="180" y1="170" x2="380" y2="170" stroke="#000000" stroke-width="9" stroke-linecap="round"/>
    <line x1="180" y1="210" x2="340" y2="210" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
    <line x1="180" y1="250" x2="360" y2="250" stroke="#000000" stroke-width="8" stroke-linecap="round"/>

    <!-- วงกลมกากบาทเตือนภัยตัวใหญ่ด้านล่าง -->
    <g transform="translate(280, 340)">
      <circle cx="0" cy="0" r="65" fill="#FF1744" stroke="#000000" stroke-width="10"/>
      <path d="M -30 -30 L 30 30 M 30 -30 L -30 30" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
      <path d="M -30 -30 L 30 30 M 30 -30 L -30 30" stroke="#000000" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
