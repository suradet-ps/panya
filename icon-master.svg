<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Base Drop Shadow -->
    <filter id="isoShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#skyGrad)" stroke="#38bdf8" stroke-width="4" />

  <g filter="url(#isoShadow)">
    <!-- Green Arc Thickness -->
    <path d="M256 56 A208 208 0 0 1 464 264 L360 264 A104 104 0 0 0 256 160 Z" fill="#047857" />
    <!-- Amber Arc Thickness -->
    <path d="M464 264 A208 208 0 0 1 256 472 L256 368 A104 104 0 0 0 360 264 Z" fill="#b45309" />
    <!-- Red Arc Thickness -->
    <path d="M256 472 A208 208 0 0 1 48 264 L152 264 A104 104 0 0 0 256 368 Z" fill="#b91c1c" />

    <!-- Top Front Surfaces -->
    <!-- Green Arc Top -->
    <path d="M256 48 A208 208 0 0 1 464 256 L360 256 A104 104 0 0 0 256 152 Z" fill="#10b981" />
    <path d="M256 48 A208 208 0 0 1 464 256 L360 256 A104 104 0 0 0 256 152 Z" fill="#ffffff" opacity="0.1" />

    <!-- Amber Arc Top -->
    <path d="M464 256 A208 208 0 0 1 256 464 L256 360 A104 104 0 0 0 360 256 Z" fill="#f59e0b" />
    <path d="M464 256 A208 208 0 0 1 256 464 L256 360 A104 104 0 0 0 360 256 Z" fill="#ffffff" opacity="0.1" />

    <!-- Red Arc Top -->
    <path d="M256 464 A208 208 0 0 1 48 256 L152 256 A104 104 0 0 0 256 352 Z" fill="#ef4444" />
    <path d="M256 464 A208 208 0 0 1 48 256 L152 256 A104 104 0 0 0 256 352 Z" fill="#ffffff" opacity="0.1" />

    <!-- Center White Badge Base Thickness -->
    <circle cx="256" cy="262" r="80" fill="#cbd5e1" />
    <!-- Center White Badge Top -->
    <circle cx="256" cy="256" r="80" fill="#ffffff" stroke="#f1f5f9" stroke-width="2" />

    <!-- Inner Icon -->
    <g transform="translate(231, 224)">
      <!-- Icon Thickness -->
      <rect x="0" y="5" width="50" height="64" rx="9" fill="#020617" />
      <!-- Icon Top Surface -->
      <rect x="0" y="0" width="50" height="64" rx="9" fill="#0f172a" />
      <line x1="10" y1="18" x2="40" y2="18" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
      <line x1="10" y1="32" x2="33" y2="32" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
      <line x1="10" y1="46" x2="25" y2="46" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
