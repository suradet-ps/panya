<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanYa - ติดตามแผนจัดซื้อยา</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <!--
    Web fonts are a progressive enhancement: the CSS fallback stack keeps the
    app fully legible on a hospital LAN with no internet.  Bundling the woff2
    files locally is a tracked follow-up (AGENTS.md open items).
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <link data-trunk rel="css" href="assets/styles/theme.css">
  <link data-trunk rel="css" href="assets/styles/app.css">
  <!--
    Trunk's copy-file puts the file at the dist ROOT (dist/logo.svg), so the
    header/favicon reference "/logo.svg".
  -->
  <link data-trunk rel="copy-file" href="assets/logo.svg">
  <!--
    The Tauri API is injected by the WebView itself (`withGlobalTauri: true`
    in tauri.conf.json), so `window.__TAURI__.core.invoke` exists
    synchronously with no network dependency.  services/tauri.rs is the only
    place that touches it.
  -->
  <link data-trunk rel="rust" data-wasm-opt="0">
</head>
<body></body>
</html>
